<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mevi Technologies</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #1f2937;
      background: #f4f7fb;
    }

    header {
      padding: 20px 8%;
      background: #102a43;
      color: white;
    }

    header h1 {
      margin: 0;
      font-size: 1.5rem;
    }

    main {
      min-height: 75vh;
      display: grid;
      place-items: center;
      padding: 48px 8%;
      text-align: center;
    }

    .hero {
      max-width: 650px;
    }

    .hero h2 {
      margin-bottom: 16px;
      color: #102a43;
      font-size: clamp(2rem, 5vw, 3.5rem);
    }

    .hero p {
      margin: 0 auto 28px;
      color: #52606d;
      font-size: 1.1rem;
      line-height: 1.7;
    }

    .button {
      display: inline-block;
      padding: 13px 22px;
      border-radius: 8px;
      background: #1677ff;
      color: white;
      font-weight: bold;
      text-decoration: none;
    }

    .button:hover {
      background: #075ac7;
    }

    footer {
      padding: 18px;
      background: #e8eef5;
      color: #52606d;
      text-align: center;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Mevi Technologies</h1>
  </header>

  <main>
    <section class="hero">
      <h2>Technology that moves you forward</h2>
      <p>
        Mevi Technologies helps businesses solve problems and build a smarter,
        more connected future.
      </p>
      <a class="button" href="mailto:hello@mevitechnologies.com">Contact Us</a>
    </section>
  </main>

  <footer>
    &copy; 2026 Mevi Technologies
  </footer>
</body>
</html>
